  function intro() {
    reset();
    render(
      "<span class='label'>修学旅行 事前学習｜岩手・三陸沿岸</span>" +
      "<h1>14:46からの30分</h1>" +
      "<p>私たちが訪れる宮古市田老・田野畑村・普代村は、2011年3月11日に津波に襲われた三陸沿岸の町です。あの日、沿岸の人々に届いた情報を、<b>実際に発表された順番</b>でたどります。あなたは各時点で、その時に分かっていた情報だけをもとに判断してください。</p>" +
      "<div class='note'>赤い見出しの「記録」は、気象庁などの公的資料に基づく事実です。点線の枠の「設定」と、「生成イメージ」と書かれた画像は、学習のための仮の状況です。<b>画像はAIで生成したイメージで、2011年の実際の写真ではありません。</b></div>" +
      "<div class='note care'>この教材には、津波の被害についての記述があります。読んでいてつらくなったら、途中でやめてかまいません。近くの先生に声をかけてください。</div>" +
      "<p>正解を当てるゲームではありません。<b>「その場にいたら、自分はどうするか」</b>を正直に選んでください。</p>" +
      "<div class='btn-row'><button class='btn' id='start'>はじめる</button></div>"
    );
    document.getElementById("start").onclick = function () { step(0); };
  }

  // ---- 各時点 ----
  function step(i) {
    state.step = i;
    var s = STEPS[i];
    var evacuated = state.evacAt !== null;
    var q = evacuated && s.questionEvac ? s.questionEvac : s.question;
    var cs = evacuated && s.choicesEvac ? s.choicesEvac : s.choices;

    var scene = evacuated && s.imgEvac ? s.imgEvac : s.img;
    var html = progress(i) +
      hero(scene, "<div class='clock'><span class='clock-time'>" + s.time + "</span><span class='clock-sub'>2011年3月11日　" + s.elapsed + "</span></div>") +
      "<div class='fact'><div class='fact-head'>記録</div><ul>" + s.facts.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>" + srcMark(s.src) + "</div>";
    if (s.setting) html += "<div class='setting'><div class='setting-head'>設定（仮の状況）</div>" + s.setting + "</div>";
    if (s.think) html += "<div class='think'>" + s.think + "</div>";
    html += "<div class='question'>" + q + "</div><div class='choices cards'>";
    cs.forEach(function (c, k) {
      html += "<button class='choice card' data-k='" + k + "'>" +
        (c.img ? "<span class='thumb'><img src='" + imgSrc(c.img) + "' alt='' loading='lazy' onerror='this.parentNode.remove()'><span class='gen'>生成イメージ</span></span>" : "") +
        "<span class='ct'>" + c.text + "</span></button>";
    });
    html += "</div>";
    render(html);

    Array.prototype.forEach.call(app.querySelectorAll(".choice"), function (b) {
      b.onclick = function () {
        var c = cs[+b.getAttribute("data-k")], id = c.id;
        state.picks.push({ time: s.time, id: id, text: c.text, img: c.img });
        if (!evacuated && id === "evac") state.evacAt = i;
        if (i + 1 < STEPS.length) step(i + 1); else reveal();
      };
    });
  }

  // ---- 実際に起きたこと ----
  function reveal() {
    var html = progress(3) +
      hero("21_reveal", "<div class='clock'><span class='clock-time'>その後</span><span class='clock-sub'>地震から数十分後（到達時刻は場所によって異なる）</span></div>") +
      "<div class='fact'><div class='fact-head'>記録　沿岸各地を津波が襲った</div><ul>" + REVEAL.facts.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>" + srcMark(REVEAL.src) + "</div>" +
      "<div class='compare'><div class='a'><div class='c'>14:49 第1報の予想（岩手県）</div><div class='n'>3m</div></div><div class='b'><div class='c'>田老で確認された痕跡の高さ</div><div class='n'>16.3m</div></div></div>" +
      "<div class='question'>あなたの判断に、いちばん影響したものは？</div><div class='choices'>";
    REASONS.forEach(function (r) { html += "<button class='choice' data-r='" + r + "'>" + r + "</button>"; });
    html += "</div>";
    render(html);
    Array.prototype.forEach.call(app.querySelectorAll(".choice"), function (b) {
      b.onclick = function () { state.reason = b.getAttribute("data-r"); result(); };
    });
  }

  // ---- ふりかえり ----
  function category() {
    if (state.evacAt === 0) return "A";
    if (state.evacAt !== null) return "B";
    return "C";
  }

  function result() {
    var cat = category();
    var me = SURVEY.filter(function (x) { return x.key === cat; })[0];
    var returned = state.picks.some(function (p) { return p.id === "return"; });

    var html = progress(4) + "<h1>あなたの30分</h1><ul class='path'>";
    state.picks.forEach(function (p) {
      html += "<li><time>" + p.time + "</time>" + p.text +
        (p.img ? "<img class='path-thumb' src='" + imgSrc(p.img) + "' alt='' onerror='this.remove()'>" : "") + "</li>";
    });
    html += "</ul>";

    html += "<h2>あなたの判断は、次の分類に近い：「" + me.name + "」</h2><p>" + me.desc + "</p>";
    if (cat === "C") html += "<div class='note'>このシミュレーションでは、あなたは15:14の時点でもまだ避難を始めていません。実際には、何かをしている最中に津波が迫り、そこから逃げた人たちがいました（下の「切迫避難」）。</div>";
    if (returned) html += "<div class='note care'>あなたは一度避難したあと、家に戻ることを選びました。避難した場所から離れることが、どんな危険につながりうるか考えてみてください。</div>";

    html += "<h2>実際に避難した人たちは、どう動いたか</h2><div class='bars'>";
    SURVEY.forEach(function (x) {
      html += "<div class='bar-row" + (x.key === cat ? " me" : "") + "'><span class='bar-name'>" + x.name + "</span><span class='bar-track'><span class='bar-fill' style='display:block;width:" + x.pct + "%'></span></span><span class='bar-pct'>" + x.pct + "%</span></div>";
    });
    html += "</div><p style='font-size:.85rem;color:var(--muted)'>内閣府・消防庁・気象庁による面接調査（2011年7月、岩手・宮城・福島で避難所や仮設住宅にいた870人）出典：[8]</p>";

    html += "<div class='think'>このグラフは<b>「生き延びて、調査に答えた人」</b>の内訳です。亡くなった方々の行動は、このデータに含まれていません。だとすると、このグラフから言えること・言えないことは何だろう？</div>";
    html += "<div class='think'>あなたの判断に影響したのは「" + state.reason + "」でした。現地では、ガイドの方に「あの日、何が判断を分けたのか」を聞いてみよう。</div>";

    html += "<h2>修学旅行で、ここを確かめよう</h2>";
    PLACES.forEach(function (p) {
      html += "<div class='fact'><div class='fact-head' style='color:var(--ink)'>" + p.name + "</div><ul>" +
        p.facts.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>" +
        "<div class='think' style='margin-bottom:0'>" + p.q + "</div></div>";
    });

    // CSV（クラス集計用）
    var cols = ["分類", "14:46の判断", "14:49の判断", "15:14の判断", "影響したもの"];
    var row = [me.name].concat(state.picks.map(function (p) { return p.text; })).concat([state.reason]);
    var csv = row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    html += "<h2>クラスのデータにしよう</h2><p>下の1行をコピーして、先生が用意したスプレッドシートに貼り付けてください。列の順番は「" + cols.join("／") + "」です。</p>" +
      "<textarea class='csv' id='csv' rows='3' readonly>" + csv + "</textarea>" +
      "<div class='btn-row'><button class='btn' id='copy'>コピーする</button><button class='btn ghost' id='again'>最初からやり直す</button></div>";

    render(html);

    document.getElementById("copy").onclick = function () {
      var ta = document.getElementById("csv");
      var btn = this;
      function done() { btn.textContent = "コピーしました"; }
      ta.select();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand("copy"); done(); });
        } else { document.execCommand("copy"); done(); }
      } catch (e) { btn.textContent = "選択済み：Ctrl+C（長押し→コピー）でコピー"; }
    };
    document.getElementById("again").onclick = intro;
  }

  intro();
})();
</script>
